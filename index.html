<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos Musicais - Clave de C</title>
    <link rel="stylesheet" href="assets/css/engine-style.css">
    <style>
        .cabecalho-portal {
            width: 100%; background: var(--card-bg); padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 4px solid var(--blue-prime); box-sizing: border-box;
        }
        .logo-portal { font-size: 2rem; color: var(--yellow-prime); font-weight: bold; margin: 0; }
        .busca-portal {
            padding: 10px 15px; border-radius: 20px; border: none;
            width: 250px; font-size: 1rem;
        }
        .grid-jogos {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px; padding: 40px 20px; width: 100%; max-width: 1200px; box-sizing: border-box;
        }
        .card-jogo {
            background: var(--card-bg); border-radius: 15px; overflow: hidden;
            border: 3px solid transparent; transition: 0.3s; cursor: pointer;
            text-decoration: none; color: white; display: flex; flex-direction: column;
        }
        .card-jogo:hover {
            transform: translateY(-5px) scale(1.03);
            border-color: var(--yellow-prime);
            box-shadow: 0 10px 20px rgba(254, 198, 1, 0.2);
        }
        .card-img { width: 100%; height: 150px; object-fit: cover; }
        .card-info { padding: 15px; text-align: center; }
        .card-titulo { margin: 0 0 10px 0; font-size: 1.2rem; color: var(--blue-prime); }
        .badge-cat { background: var(--purple-prime); padding: 5px 10px; border-radius: 10px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header class="cabecalho-portal">
        <h1 class="logo-portal">Clave de C Games 🎮</h1>
        <input type="text" class="busca-portal" placeholder="Buscar jogos...">
    </header>

    <main class="grid-jogos" id="vitrine-jogos">
        <!-- Os cards aparecem aqui automaticamente! -->
    </main>

    <script>
        fetch('games.json')
            .then(response => response.json())
            .then(jogos => {
                const vitrine = document.getElementById('vitrine-jogos');
                jogos.forEach(jogo => {
                    const card = `
                        <a href="${jogo.url}" class="card-jogo">
                            <img src="${jogo.imagem}" alt="${jogo.nome}" class="card-img">
                            <div class="card-info">
                                <h3 class="card-titulo">${jogo.nome}</h3>
                                <span class="badge-cat">${jogo.categoria}</span>
                            </div>
                        </a>
                    `;
                    vitrine.insertAdjacentHTML('beforeend', card);
                });
            })
            .catch(error => console.error('Erro ao carregar o catálogo:', error));
    </script>
</body>
</html>
